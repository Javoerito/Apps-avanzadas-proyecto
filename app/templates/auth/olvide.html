{% extends "base.html" %}{% from "_macros.html" import campo %}{% block title %}Recuperar contraseña{% endblock %}
{% block content %}
<section class="tarjeta estrecha">
  <h1>Recuperar contraseña</h1>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}{{ campo(form.email) }}
    <button class="btn" type="submit">Enviar enlace</button>
  </form>
  <p><a href="{{ url_for('auth.signin') }}">Volver</a></p>
</section>
{% endblock %}
