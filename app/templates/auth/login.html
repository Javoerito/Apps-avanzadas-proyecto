{% extends "base.html" %}{% from "_macros.html" import campo %}{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<section class="tarjeta estrecha">
  <h1>Iniciar sesión</h1>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    {{ campo(form.email) }}{{ campo(form.password) }}
    <button class="btn" type="submit">Entrar</button>
  </form>
  <p><a href="{{ url_for('auth.olvide') }}">¿Olvidaste tu contraseña?</a> · <a href="{{ url_for('auth.signup') }}">Crear cuenta</a></p>
</section>
{% endblock %}
