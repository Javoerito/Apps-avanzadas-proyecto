{% extends "base.html" %}{% from "_macros.html" import campo %}{% block title %}Nuevo proveedor{% endblock %}
{% block content %}
<section class="tarjeta estrecha"><h1>Nuevo proveedor</h1>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}{{ campo(form.nombre) }}{{ campo(form.ruc) }}{{ campo(form.telefono) }}
    <button class="btn" type="submit">Guardar</button>
    <a class="btn btn-sec" href="{{ url_for('main.proveedores') }}">Cancelar</a>
  </form></section>
{% endblock %}
